name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PVirtualSoftwareFactory.slnx

      - name: Build
        run: dotnet build PVirtualSoftwareFactory.slnx --no-restore --configuration Release

      # Api.Tests (specs/health-check/) es el primer proyecto de test real
      # del repo -> este paso ya es bloqueante (Article IV/V de la Constitution).
      - name: Test
        run: dotnet test PVirtualSoftwareFactory.slnx --no-build --configuration Release

      # Informativo por ahora (Article III) - se vuelve bloqueante mas adelante
      # si el equipo lo decide, una vez que haya paquetes reales en uso.
      - name: Check for vulnerable packages
        run: dotnet list PVirtualSoftwareFactory.slnx package --vulnerable --include-transitive
        continue-on-error: true

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Informativo por ahora (Article III), igual que el chequeo de NuGet.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
