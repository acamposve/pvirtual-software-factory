name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PVirtualSoftwareFactory.slnx

      - name: Build
        run: dotnet build PVirtualSoftwareFactory.slnx --no-restore --configuration Release

      # Todavia no hay proyectos de test (Fase 4 los agrega). Se deja el paso
      # listo y no bloqueante hasta que exista el primero, para no romper CI
      # con un comando que hoy no tiene nada que correr.
      - name: Test
        run: dotnet test PVirtualSoftwareFactory.slnx --no-build --configuration Release
        continue-on-error: true

      # Informativo por ahora (Article III) - se vuelve bloqueante mas adelante
      # si el equipo lo decide, una vez que haya paquetes reales en uso.
      - name: Check for vulnerable packages
        run: dotnet list PVirtualSoftwareFactory.slnx package --vulnerable --include-transitive
        continue-on-error: true

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # --legacy-peer-deps: typescript-eslint@8.68.0 (scaffold de create-vite)
      # todavia declara peer typescript <6.1.0, pero el proyecto quedo con
      # typescript@7.0.2 -> npm ci estricto corta con ERESOLVE. Esto es un
      # workaround temporal; el arreglo real es correr 'npm install'
      # localmente para que npm re-resuelva versiones compatibles y
      # commitear el package-lock.json actualizado (requiere acceso real al
      # registry de npm, que no tengo desde este entorno).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Informativo por ahora (Article III), igual que el chequeo de NuGet.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
