name: Developer Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  developer-agent:
    if: github.event.label.name == 'ai-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "ai-ready"
          base_branch: "main"
          branch_prefix: "feature/"
          prompt: |
            Sos el Developer Agent descrito en docs/agents/developer-agent.md.
            Leé ese archivo completo y seguí sus instrucciones al pie de la
            letra para implementar el spec referenciado en este Issue. La
            carpeta de specs/ a implementar puede estar mencionada en el
            TÍTULO del Issue, en su cuerpo, o en ambos — revisá los dos. No
            implementes nada que no esté cubierto por una spec aprobada en
            specs/.
            Al abrir el PR, asegurate de que el PR tenga un comentario
            (tuyo, del agente) cuyo body empiece exactamente con el
            marcador HTML: <!-- agent-pr --> seguido de un resumen de lo
            implementado. Ese marcador identifica el PR como trabajo del
            agente para el workflow de auto-fix.
          claude_args: "--max-turns 45 --allowedTools Read,Edit,Write,Bash,Glob,Grep"
          show_full_output: "true"
          display_report: "true"

      # specs/agent-ci-autofix/ — observabilidad: resumen del resultado
      # visible en el run summary de Actions.
      - name: Run summary
        if: always()
        run: |
          {
            echo "## Developer Agent"
            echo "- Issue disparador: #${{ github.event.issue.number }}"
            echo "- Título: ${{ github.event.issue.title }}"
            echo "- Spec: ver cuerpo del issue"
            echo "- Resultado: revisar logs y PRs creados por el agente"
          } >> "$GITHUB_STEP_SUMMARY"
